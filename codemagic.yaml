# Cloud macOS build for Green VPN (iOS) — you have no Mac, this builds the
# IPA for you on Codemagic's macOS machines and uploads it to App Store
# Connect. Same pattern as the Green Hole iOS project (D:\ios\greenhole).
#
# ONE-TIME SETUP:
#   1. Confirm the Apple Developer Program account (applied for as of
#      2026-08-12) is actually ACTIVE.
#   2. Request the "Network Extensions" capability / Personal VPN
#      entitlement from Apple for this account — a VPN app cannot ship
#      without it, and approval can take days, so file this BEFORE the
#      native PacketTunnelProvider extension is finished. See
#      greenvpn-ios-app memory for why this is the biggest blocker.
#   3. Push this project (D:\ios\greenvpn) to a GitHub/GitLab repo.
#   4. In Codemagic: add the app from that repo.
#   5. Codemagic > Teams > Integrations > App Store Connect: create an API
#      key integration named exactly "AppStoreConnect" (matches below).
#   6. Register the bundle id com.oscar.greenvpn in App Store Connect
#      (plus the PacketTunnelExtension's own bundle id, once that target
#      exists) and create the app record (name: Green VPN).
#   7. Push a commit — this workflow runs, signs, and uploads to TestFlight.
#
# No Mac and no local Xcode are ever needed; everything below runs in the
# cloud. NOTE: as of 2026-08-12 the native VPN tunnel (NEPacketTunnelProvider
# extension) hasn't been added to this project yet — this workflow currently
# builds/ships the UI shell only. Adding the extension target needs either
# hand-edited project.pbxproj or a tool like XcodeGen run as a build step
# here (candidate approach, not yet wired in).

workflows:
  ios-release:
    name: Green VPN iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.oscar.greenvpn
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.oscar.greenvpn"
        APP_STORE_APPLE_ID: 0000000000  # replace with the numeric Apple ID of the app record
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Flutter analyze
        script: flutter analyze
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight automatically. Flip submit_to_app_store to true
        # only when you're ready to push to actual App Store review.
        submit_to_testflight: true
        submit_to_app_store: false
